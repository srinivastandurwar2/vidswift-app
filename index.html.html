<!DOCTYPE html><html><head><title>VidSwift</title>
<style>body{font-family:sans-serif;background:#f5f5f5;text-align:center;padding:50px}input{width:80%;max-width:500px;padding:15px;border-radius:10px;border:2px solid #6c5ce7}button{padding:15px 40px;background:#6c5ce7;color:white;border:none;border-radius:30px;margin-top:20px;font-size:18px;cursor:pointer}</style>
</head><body>
<h1>VidSwift Downloader</h1>
<input id="link" placeholder="Link Taka - https://www.facebook.com/share/r/1HDCWgz9dc/">
<br><button onclick="download()">Download</button>
<p id="status"></p>
<script>
async function download(){
 let url=document.getElementById('link').value;
 document.getElementById('status').innerText="Downloading...";
 let res=await fetch('/download',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:url})});
 let data=await res.json();
 document.getElementById('status').innerText=data.status=='success' ? "Zala! "+data.title : "Error: "+data.error;
}
</script></body></html>
